name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you also trigger it manually from GitHub's UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -w "%{http_code}" https://generalist.onrender.com/search-drugs?q=a
